# Each e-stop name in e_stop_names needs to be assigned to at least one <e_stop>_topic !
e_stop_manager:
  ros__parameters:
    e_stop_names: ["hard_remote_e_stop", "soft_remote_e_stop", "big_red_button_e_stop", "ui_e_stop"]

    e_stop_config:
      hard_remote_e_stop:
        aggregated_topic: "/emergency_stop_hardware"
        tracked_topic: true
        initial_value: false
      soft_remote_e_stop:
        aggregated_topic: "/emergency_stop_software"
        tracked_topic: true
        initial_value: false
      big_red_button_e_stop:
        aggregated_topic: "/emergency_stop_software"
        initial_value: false
        tracked_topic: true
      ui_e_stop:
        aggregated_topic: "/emergency_stop_software"
        initial_value: false
        tracked_topic: false
