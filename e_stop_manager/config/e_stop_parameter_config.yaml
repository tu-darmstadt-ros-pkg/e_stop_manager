e_stop_manager_config:
  publisher_grace_ms:
    type: int
    default_value: 0
    read_only: true
    description: "A tracked source that had a publisher counts as triggered once it has had no publisher for this long since its last message or last counted publisher. 0 disables this, else at least 100."
  e_stop_names:
    type: string_array
    read_only: true
    validation:
      unique<>: null
      not_empty<>: null
      "generate_parameter_lib_validators::valid_relative_topic_name": null

  e_stop_config:
    __map_e_stop_names:
      aggregated_topic:
        type: string
        default_value: "/soft_estop"
        read_only: true
        validation:
          not_empty<>: null
          "generate_parameter_lib_validators::valid_topic_name": null
      initial_value:
        type: bool
        default_value: false
        read_only: true
      tracked_topic:
        type: bool
        read_only: true
